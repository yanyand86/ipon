   TOOLS
   ================================================================ */
function renderTools(){
  const s=$("#scr-tools");s.innerHTML="";
  s.appendChild(el("div","card rise",'<div style="display:flex;gap:13px;align-items:center"><span class="icn teal">🧰</span><div><b>The Toolbox</b><div style="font-size:13.5px;color:var(--ink-soft)">Quick references for the moment you’re actually writing something.</div></div></div>'));
  s.appendChild(tileBtn("💬","teal","Phrase bank","Searchable phrases for emails, meetings, calls & small talk.",false,openPhrases));
  s.appendChild(tileBtn("✨","teal","Say it better","Wordy or odd → plain and natural. The de-jargoniser.",false,openSwaps));
  s.appendChild(tileBtn("🔀","teal","Confusables dictionary","Practice or practise? Licence or license? Sorted.",false,openConfusables));
  s.appendChild(tileBtn("✅","teal","Send-it checklist","Eleven checks before any important email leaves.",false,openChecklist));
  s.appendChild(tileBtn("🇬🇧","teal","UK vs US spelling","Colour, centre, organise — the patterns in one table.",false,openSpelling));
  s.appendChild(tileBtn("⚙️","teal","Settings","Voice speed, progress reset.",false,openSettings));
}

function openPhrases(){
  openDetail("💬 Phrase bank",body=>{
    const search=el("input","search");
    search.placeholder="Search phrases… e.g. “mind”, “grateful”, “weekend”";
    body.appendChild(search);
    const list=el("div");body.appendChild(list);
    function draw(){
      const f=search.value.trim().toLowerCase();
      list.innerHTML="";
      PHRASES.forEach(g=>{
        const items=g.items.filter(it=>!f||it.p.toLowerCase().includes(f)||(it.note||"").toLowerCase().includes(f));
        if(!items.length)return;
        const c=el("div","card");
        c.appendChild(el("b",null,g.cat));
        items.forEach(it=>{
          const row=el("div","phr");
          row.appendChild(el("span","ptxt",it.p+(it.note?'<span class="pnote">'+it.note+"</span>":"")));
          row.appendChild(playBtn(it.p));
          row.appendChild(copyBtnEl(it.p));
          c.appendChild(row);
        });
        list.appendChild(c);
      });
      if(!list.children.length)list.appendChild(el("div","note","Nothing matches “"+search.value+"” — try a shorter word."));
    }
    search.addEventListener("input",draw);
    draw();
  });
}
function openSwaps(){
  openDetail("✨ Say it better",body=>{
    body.appendChild(el("div","note","The left column is what people write; the right is what UK readers prefer. Swapping these is the single fastest upgrade to your emails."));
    const c=el("div","card");
    SWAPS.forEach(sw=>{
      c.appendChild(el("div","swap",'<span class="from">'+sw.from+'</span><span class="arrow">→</span><span class="to">'+sw.to+"</span>"+(sw.note?'<span class="snote">'+sw.note+"</span>":"")));
    });
    body.appendChild(c);
  });
}
function openConfusables(){
  openDetail("🔀 Confusables dictionary",body=>{
    const c=el("div","card");
    CONFUSABLES.forEach(cf=>{
      c.appendChild(el("div","confu",'<div class="cpair">'+cf.a+" · "+cf.b+'</div><div class="crule">'+cf.rule+'</div><div class="cex">'+cf.ex+"</div>"));
    });
    body.appendChild(c);
  });
}
function openChecklist(){
  openDetail("✅ Send-it checklist",body=>{
    body.appendChild(el("div","note","Run this before any email that matters — to your manager, a consultant, HR, or a big group. Tap to tick."));
    const c=el("div","card");
    const state=store.checks.length===CHECKLIST.length?store.checks:CHECKLIST.map(()=>false);
    function draw(){
      c.innerHTML="";
      CHECKLIST.forEach((item,ix)=>{
        const row=el("div","checkitem"+(state[ix]?" on":""),'<span class="checkbox">'+(state[ix]?"✓":"")+"</span><span>"+item+"</span>");
        row.addEventListener("click",()=>{
          state[ix]=!state[ix];store.checks=state;save();draw();
          if(state.every(Boolean)){confetti(60);}
        });
        c.appendChild(row);
      });
      const done=state.filter(Boolean).length;
      const foot=el("div",null,'<div class="divider"></div><div style="display:flex;align-items:center;gap:12px"><div class="prog" style="flex:1"><div class="progfill teal" style="width:'+(done/CHECKLIST.length*100)+'%"></div></div><span class="qcount">'+done+" / "+CHECKLIST.length+"</span></div>");
      const reset=el("button","btn ghost small","↻ Reset for next email");
      reset.style.marginTop="12px";
      reset.addEventListener("click",()=>{state.fill(false);store.checks=state;save();draw();});
      foot.appendChild(reset);
      c.appendChild(foot);
    }
    draw();
    body.appendChild(c);
  });
}
function openSpelling(){
  openDetail("🇬🇧 UK vs US spelling",body=>{
    body.appendChild(el("div","note","You're writing for UK readers, so the left column wins. Set your phone and Word to “English (United Kingdom)” and half the battle is automatic."));
    const c=el("div","card");
    let t='<table class="extable"><tr><th>UK 🇬🇧</th><th>US 🇺🇸</th><th>Pattern</th></tr>';
    SPELLINGS.forEach(sp=>{t+="<tr><td><b>"+sp.uk+"</b></td><td>"+sp.us+"</td><td>"+sp.rule+"</td></tr>";});
    t+="</table>";
    c.innerHTML=t;
    body.appendChild(c);
  });
}
function openSettings(){
  openDetail("⚙️ Settings",body=>{
    const c=el("div","card");
    c.appendChild(el("b",null,"🔊 Voice speed"));
    c.appendChild(el("p",null,'<span style="font-size:13.5px;color:var(--ink-soft)">How fast the British voice reads phrases and words.</span>'));
    const slider=el("input","slider");
    slider.type="range";slider.min="0.6";slider.max="1.3";slider.step="0.05";slider.value=store.rate;
    const lbl=el("div","qcount","Speed: "+Number(store.rate).toFixed(2)+"×");
    slider.addEventListener("input",()=>{store.rate=Number(slider.value);save();lbl.textContent="Speed: "+Number(store.rate).toFixed(2)+"×";});
    c.appendChild(slider);c.appendChild(lbl);
    const test=el("button","btn teal small","🔊 Test the voice");
    test.style.marginTop="10px";
    test.addEventListener("click",()=>speak("Hello! This is your practice voice. Shall we polish some English today?"));
    c.appendChild(test);
    body.appendChild(c);
    const c2=el("div","card");
    c2.appendChild(el("b",null,"🧹 Start over"));
    c2.appendChild(el("p",null,'<span style="font-size:13.5px;color:var(--ink-soft)">Erases XP, streak, badges and all completed lessons on this device.</span>'));
    const rst=el("button","btn ghost small","Reset all progress…");
    rst.addEventListener("click",()=>{
      if(confirm("Really reset all progress? This cannot be undone.")){localStorage.removeItem(KEY);location.reload();}
    });
    c2.appendChild(rst);
    body.appendChild(c2);
    body.appendChild(el("div","note","Husay works fully offline once loaded — add it to your Home Screen and practise anywhere, even on the bus. 🚌"));
  });
}
