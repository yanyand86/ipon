<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Husay — Everyday English for Work</title>
<meta name="description" content="Polish your everyday English for work: grammar, emails, lectures, reading and speaking — with exercises, scenarios and tools.">
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Husay">
<style>
:root{
  --bg:#F7F5FF;
  --card:#FFFFFF;
  --ink:#241E4E;
  --ink-soft:#575180;
  --ink-faint:#928DB5;
  --rule:#E9E5F8;
  --violet:#6C5CE7; --violet-deep:#4B3BC4; --violet-tint:#EEEBFF;
  --teal:#00B8A9;   --teal-deep:#00897E;   --teal-tint:#DDF6F3;
  --coral:#FF6B6B;  --coral-deep:#D94F4F;  --coral-tint:#FFE9E9;
  --amber:#FF9F1A;  --amber-deep:#CC7A00;  --amber-tint:#FFF0D9;
  --pink:#F368E0;   --pink-deep:#C43BAF;   --pink-tint:#FDE8F9;
  --green:#20BF6B;  --green-deep:#168F4E;  --green-tint:#E0F7EA;
  --red:#EE5253;    --red-tint:#FDE4E4;
  --gold:#FFD32A;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --radius:18px;
  --nav-h:66px;
  --shadow:0 4px 18px rgba(76,59,196,0.09);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  font-size:16px;line-height:1.6;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}

/* ============ masthead ============ */
.masthead{
  position:relative;overflow:hidden;
  padding:calc(16px + env(safe-area-inset-top)) 20px 18px;
  background:linear-gradient(118deg,var(--violet-deep),var(--violet) 38%,#9B6BF2 62%,var(--pink) 92%,#FF8FB8);
  background-size:230% 230%;
  animation:aurora 16s ease-in-out infinite alternate;
  color:#fff;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 3px 16px rgba(76,59,196,0.35);
}
@keyframes aurora{from{background-position:0% 40%}to{background-position:100% 60%}}
.mh-left{flex:1;min-width:0;position:relative;z-index:2}
.masthead h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;letter-spacing:-0.01em}
.masthead .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;opacity:0.88;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;position:relative;z-index:2}
.mh-chip{
  font-family:var(--mono);font-size:11px;letter-spacing:0.04em;font-weight:700;
  background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.4);
  border-radius:99px;padding:3px 11px;color:#fff;white-space:nowrap;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(4px);
}
.mh-chip .flame{display:inline-block}
.mh-chip.hot .flame{animation:flick 1s ease-in-out infinite alternate}
@keyframes flick{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.18)}}
.mh-float{position:absolute;font-family:var(--serif);font-weight:700;color:rgba(255,255,255,0.14);pointer-events:none;user-select:none;z-index:1}
.mh-float.f1{font-size:64px;top:-6px;right:88px;animation:bob 7s ease-in-out infinite alternate}
.mh-float.f2{font-size:34px;bottom:-8px;left:34%;animation:bob 9s 1s ease-in-out infinite alternate-reverse}
.mh-float.f3{font-size:26px;top:8px;left:52%;animation:bob 6s .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(10px) rotate(8deg)}}

main{max-width:640px;margin:0 auto;padding:18px 16px 34px}

/* ============ shared bits ============ */
.rise{animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
.rise.d1{animation-delay:.06s}.rise.d2{animation-delay:.12s}.rise.d3{animation-delay:.18s}.rise.d4{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sectionlabel{
  font-family:var(--mono);font-size:11.5px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--ink-faint);margin:24px 0 10px;display:flex;align-items:center;gap:10px;
}
.sectionlabel::after{content:"";flex:1;height:1px;background:var(--rule)}
.card{
  background:var(--card);border-radius:var(--radius);padding:18px;
  box-shadow:var(--shadow);border:1px solid rgba(233,229,248,0.8);
  margin-bottom:14px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--violet);color:#fff;border:none;border-radius:99px;
  font-weight:700;font-size:15px;padding:13px 26px;cursor:pointer;
  box-shadow:0 4px 12px rgba(108,92,231,0.35);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:scale(0.95)}
.btn:disabled{opacity:0.35;cursor:default;box-shadow:none}
.btn.coral{background:var(--coral);box-shadow:0 4px 12px rgba(255,107,107,0.35)}
.btn.amber{background:var(--amber);box-shadow:0 4px 12px rgba(255,159,26,0.35)}
.btn.teal{background:var(--teal);box-shadow:0 4px 12px rgba(0,184,169,0.35)}
.btn.green{background:var(--green);box-shadow:0 4px 12px rgba(32,191,107,0.35)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--rule);box-shadow:none;font-weight:600}
.btn.small{font-size:13px;padding:8px 16px}
.icn{
  display:grid;place-items:center;flex:0 0 auto;
  width:46px;height:46px;border-radius:15px;font-size:23px;
  background:var(--violet-tint);
}
.icn.teal{background:var(--teal-tint)}.icn.coral{background:var(--coral-tint)}
.icn.amber{background:var(--amber-tint)}.icn.pink{background:var(--pink-tint)}
.icn.green{background:var(--green-tint)}
.prog{height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.progfill{
  height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--violet),var(--pink));
  transition:width .8s cubic-bezier(.2,.8,.3,1);
}
.progfill.teal{background:linear-gradient(90deg,var(--teal),#5EE0D4)}
.progfill.coral{background:linear-gradient(90deg,var(--coral),#FFA26B)}
.progfill.amber{background:linear-gradient(90deg,var(--amber),var(--gold))}
.pill{
  display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:0.06em;text-transform:uppercase;border-radius:99px;padding:3px 10px;
}
.pill.violet{background:var(--violet-tint);color:var(--violet-deep)}
.pill.teal{background:var(--teal-tint);color:var(--teal-deep)}
.pill.coral{background:var(--coral-tint);color:var(--coral-deep)}
.pill.amber{background:var(--amber-tint);color:var(--amber-deep)}
.pill.pink{background:var(--pink-tint);color:var(--pink-deep)}
.pill.green{background:var(--green-tint);color:var(--green-deep)}
.note{
  background:var(--violet-tint);border-left:4px solid var(--violet);
  border-radius:10px;padding:10px 14px;font-size:14.5px;color:var(--ink-soft);margin:12px 0;
}
.divider{height:1px;background:var(--rule);margin:14px 0}

/* ============ tiles (lesson / activity cards) ============ */
.tile{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid rgba(233,229,248,0.8);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:11px;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .13s ease;
}
.tile:active{transform:scale(0.975)}
.tile .tt{display:block;font-weight:750;font-size:15.5px;line-height:1.3}
.tile .tb{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.45}
.tile .tmid{flex:1;min-width:0}
.tile .done{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;font-weight:800;color:#fff;background:var(--green);
  animation:popin .4s cubic-bezier(.34,1.56,.64,1) both;
}
.tile .todo{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px dashed var(--rule)}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}

/* ============ home ============ */
.hero{
  background:linear-gradient(135deg,#FFFFFF,#F4F0FF);
  border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
  border:1px solid rgba(233,229,248,0.9);margin-bottom:14px;
}
.hero h2{font-family:var(--serif);font-size:21px;font-weight:650;line-height:1.25}
.hero .sub{color:var(--ink-soft);font-size:14px;margin-top:4px}
.statrow{display:flex;gap:10px;margin-bottom:14px}
.stat{
  flex:1;background:var(--card);border-radius:16px;padding:12px 8px;text-align:center;
  box-shadow:var(--shadow);border:1px solid rgba(233,229,248,0.8);
}
.stat .big{font-family:var(--mono);font-weight:800;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:2px}
.stat .em{font-size:17px;display:block;margin-bottom:1px}
.lvlbar{display:flex;align-items:center;gap:10px;margin-top:12px}
.lvlbar .prog{flex:1}
.lvlbar .lv{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--violet-deep);white-space:nowrap}
.planrow{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.planitem{
  display:flex;align-items:center;gap:11px;background:var(--card);
  border:1px solid var(--rule);border-radius:14px;padding:10px 13px;cursor:pointer;
  font-size:14px;font-weight:600;text-align:left;width:100%;
  transition:transform .12s ease;
}
.planitem:active{transform:scale(0.97)}
.planitem .pi-ic{font-size:20px}
.planitem .pi-go{margin-left:auto;color:var(--ink-faint);font-weight:800}
.wotd{background:linear-gradient(135deg,var(--teal-tint),#FFFFFF)}
.wotd .w{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--teal-deep)}
.wotd .pos{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:8px}
.wotd .def{margin-top:6px;font-size:15px}
.wotd .ex{margin-top:6px;font-size:14px;color:var(--ink-soft);font-style:italic}
.tipcard{background:linear-gradient(135deg,var(--amber-tint),#FFFFFF)}
.tipcard .tiptext{font-size:15px;margin-top:4px}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.badge{
  flex:0 0 auto;width:76px;text-align:center;padding:10px 4px 8px;border-radius:16px;
  background:var(--card);border:1px solid var(--rule);position:relative;overflow:hidden;
}
.badge .bic{font-size:26px;display:block}
.badge .bnm{font-size:9.5px;font-family:var(--mono);font-weight:700;letter-spacing:0.02em;color:var(--ink-soft);margin-top:4px;line-height:1.3;display:block}
.badge.locked{opacity:0.38;filter:grayscale(1)}
.badge.earned::after{
  content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,0.85),transparent);
  animation:shine 3.2s ease-in-out infinite;
}
@keyframes shine{0%{left:-80%}45%{left:130%}100%{left:130%}}

/* ============ quiz ============ */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qhead .prog{flex:1}
.qcount{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-faint);white-space:nowrap}
.qtext{font-size:17px;font-weight:650;line-height:1.45;margin-bottom:14px}
.qtext .blank{border-bottom:2px solid var(--violet);color:var(--violet);padding:0 4px;font-family:var(--mono)}
.opt{
  display:block;width:100%;text-align:left;background:var(--card);
  border:1.8px solid var(--rule);border-radius:14px;padding:12px 15px;margin-bottom:10px;
  font-size:15px;font-weight:550;cursor:pointer;line-height:1.4;
  transition:transform .12s ease,border-color .15s,background .15s;
}
.opt:active{transform:scale(0.98)}
.opt.correct{border-color:var(--green);background:var(--green-tint);animation:popopt .35s cubic-bezier(.34,1.56,.64,1)}
.opt.wrong{border-color:var(--red);background:var(--red-tint);animation:shake .4s ease}
.opt.reveal{border-color:var(--green);background:var(--green-tint)}
.opt:disabled{cursor:default}
@keyframes popopt{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.why{
  background:var(--violet-tint);border-radius:12px;padding:11px 14px;font-size:14px;
  color:var(--ink-soft);margin:4px 0 12px;animation:rise .3s ease both;
}
.why b{color:var(--violet-deep)}
.scorecard{text-align:center;padding:28px 18px}
.scorecard .bigscore{font-family:var(--mono);font-weight:800;font-size:44px;color:var(--violet-deep);line-height:1.1}
.scorecard .msg{font-size:16px;font-weight:650;margin-top:6px}
.scorecard .submsg{font-size:14px;color:var(--ink-soft);margin-top:4px;margin-bottom:18px}

/* ============ detail overlay ============ */
.detail{
  position:fixed;inset:0;background:var(--bg);z-index:90;display:none;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
}
.detail.open{display:block;animation:slidein .28s cubic-bezier(.2,.8,.3,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(7%)}to{opacity:1;transform:none}}
.dethead{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:rgba(247,245,255,0.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
.backbtn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--rule);
  background:var(--card);font-size:17px;font-weight:800;cursor:pointer;color:var(--violet-deep);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow);
  transition:transform .12s ease;
}
.backbtn:active{transform:scale(0.92)}
.dethead .dt{font-weight:750;font-size:16.5px;line-height:1.25;flex:1;min-width:0}
.detbody{max-width:640px;margin:0 auto;padding:18px 16px 30px}

/* ============ lesson body typography ============ */
.lesson h3{font-family:var(--serif);font-size:19px;font-weight:650;margin:20px 0 8px}
.lesson p{margin:0 0 12px;font-size:15.5px}
.lesson .goodline,.lesson .badline{
  display:block;border-radius:12px;padding:9px 13px;margin:7px 0;font-size:14.5px;line-height:1.45;
}
.lesson .goodline{background:var(--green-tint);border-left:4px solid var(--green)}
.lesson .badline{background:var(--red-tint);border-left:4px solid var(--red);text-decoration:none}
.lesson .badline s{text-decoration-color:rgba(238,82,83,0.6)}
.extable{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px;border-radius:12px;overflow:hidden}
.extable th{background:var(--violet-tint);color:var(--violet-deep);font-family:var(--mono);font-size:11px;letter-spacing:0.05em;text-transform:uppercase;padding:8px 10px;text-align:left}
.extable td{border-bottom:1px solid var(--rule);padding:8px 10px;vertical-align:top}
.extable tr:last-child td{border-bottom:none}

/* ============ reading ============ */
.paper{
  background:linear-gradient(180deg,#FFFDF6,#FFF9EC);
  border:1px solid #F0E6CC;border-radius:var(--radius);padding:20px;
  font-family:var(--serif);font-size:16.5px;line-height:1.75;box-shadow:var(--shadow);
  margin-bottom:16px;
}
.paper h3{font-size:20px;margin-bottom:10px}
.paper p{margin-bottom:12px}
.vocabchip{
  display:inline-flex;align-items:center;gap:6px;background:var(--teal-tint);color:var(--teal-deep);
  border:1px solid rgba(0,184,169,0.3);border-radius:99px;padding:6px 14px;margin:0 8px 8px 0;
  font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s ease;
}
.vocabchip:active{transform:scale(0.94)}
.vocabdef{
  background:var(--teal-tint);border-radius:12px;padding:12px 15px;font-size:14.5px;
  margin:4px 0 12px;animation:rise .25s ease both;color:var(--ink-soft);
}
.vocabdef b{color:var(--teal-deep)}

/* ============ write / scenario ============ */
.mailpreview{
  background:#FFFFFF;border:1.5px solid var(--rule);border-radius:14px;overflow:hidden;margin:12px 0;
  box-shadow:var(--shadow);
}
.mailpreview .mp-sub{
  background:var(--violet-tint);padding:10px 15px;font-weight:750;font-size:14.5px;
  border-bottom:1px solid var(--rule);
}
.mailpreview .mp-body{padding:14px 15px;font-size:14.5px;line-height:1.65;white-space:pre-line}
.mailline{animation:rise .35s ease both}
.steplbl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--coral-deep);margin-bottom:6px}
.tpl .tplbody{
  background:var(--bg);border:1px dashed var(--rule);border-radius:12px;padding:13px 15px;
  font-size:14px;line-height:1.6;white-space:pre-line;margin-top:10px;color:var(--ink-soft);
}
.copychip{
  display:inline-flex;align-items:center;gap:6px;border:none;background:var(--violet-tint);
  color:var(--violet-deep);font-weight:700;font-size:13px;border-radius:99px;padding:8px 16px;
  cursor:pointer;margin-top:10px;transition:transform .12s ease;
}
.copychip:active{transform:scale(0.94)}
.tonebox{border-radius:12px;padding:11px 14px;margin:8px 0;font-size:14.5px}
.tonebox .tl{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;display:block;margin-bottom:3px}
.tonebox.casual{background:var(--red-tint)}.tonebox.casual .tl{color:var(--red)}
.tonebox.right{background:var(--green-tint)}.tonebox.right .tl{color:var(--green-deep)}
.tonebox.stiff{background:var(--amber-tint)}.tonebox.stiff .tl{color:var(--amber-deep)}

/* ============ speak ============ */
.phr{
  display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--rule);
}
.phr:last-child{border-bottom:none}
.phr .ptxt{flex:1;font-size:14.5px;line-height:1.45}
.phr .pnote{display:block;font-size:12px;color:var(--ink-faint);margin-top:1px}
.roundbtn{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;flex:0 0 auto;
  display:grid;place-items:center;font-size:15px;transition:transform .12s ease;
}
.roundbtn:active{transform:scale(0.88)}
.roundbtn.play{background:var(--amber-tint);color:var(--amber-deep)}
.roundbtn.copy{background:var(--violet-tint);color:var(--violet-deep)}
.roundbtn.mic{background:var(--coral-tint);color:var(--coral-deep);font-size:17px}
.roundbtn.mic.listening{background:var(--coral);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,107,107,0.5)}50%{transform:scale(1.08);box-shadow:0 0 0 10px rgba(255,107,107,0)}}
.pronword{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--rule)}
.pronword:last-child{border-bottom:none}
.pronword .pw{font-weight:750;font-size:16px}
.pronword .ph{font-family:var(--mono);font-size:12px;color:var(--amber-deep);display:block;margin-top:1px}
.pronword .ptip{font-size:12.5px;color:var(--ink-faint);display:block;margin-top:2px}
.pronword .pmid{flex:1;min-width:0}
.sayresult{font-size:13px;font-weight:700;margin:6px 0 4px;animation:rise .25s ease both}
.sayresult.good{color:var(--green-deep)}
.sayresult.tryagain{color:var(--coral-deep)}
.bigword{
  text-align:center;font-family:var(--serif);font-size:34px;font-weight:700;
  padding:26px 10px;color:var(--amber-deep);
}
.pairbtns{display:flex;gap:12px}
.pairbtns .opt{flex:1;text-align:center;font-size:19px;font-weight:750;padding:20px 10px}
.speedrow{display:flex;gap:8px;margin:10px 0}
.speedchip{

<script>
"use strict";
/* ================================================================
   GRAMMAR LESSONS
   ================================================================ */
const LESSONS = [
{
id:"articles", icon:"🅰️", color:"violet", title:"A, an & the — sounding natural",
blurb:"The tiny words that make the biggest difference.",
body:`
<p>Articles are the little words <b>a</b>, <b>an</b> and <b>the</b>. Many languages (including Tagalog) manage without them, so they are the most common thing to slip on — and readers notice them straight away in emails.</p>
<h3>The one-second rule</h3>
<p><b>A / an</b> = one of many, first mention, not specific. <b>The</b> = you and your reader both know which one. <b>No article</b> = plural or uncountable things in general.</p>
<span class="goodline">✓ I saw <b>a</b> patient this morning. <b>The</b> patient was anxious. <i>(first mention → a; second mention → the)</i></span>
<span class="goodline">✓ <b>The</b> meeting room on level 2 is free. <i>(we both know which room)</i></span>
<span class="goodline">✓ I love <b>coffee</b>. <b>Nurses</b> work hard. <i>(things in general → no article)</i></span>
<h3>A or an? Listen, don't look</h3>
<p>Use <b>an</b> before a vowel <i>sound</i>, not a vowel letter: <b>an</b> hour, <b>an</b> honest answer, <b>an</b> X-ray — but <b>a</b> university, <b>a</b> one-off, <b>a</b> UK passport.</p>
<h3>Traps to watch</h3>
<span class="badline">✗ <s>I will send you email later.</s></span>
<span class="goodline">✓ I will send you <b>an</b> email later.</span>
<span class="badline">✗ <s>Can you check the my report?</s> — never two determiners together.</span>
<span class="goodline">✓ Can you check <b>my</b> report?</span>
<span class="badline">✗ <s>She is in the hospital as a nurse.</s> <i>(UK English: at work there, not a patient)</i></span>
<span class="goodline">✓ She works <b>in hospital</b> / She is <b>at the hospital</b> for her shift.</span>
<p>Quick email check: every singular countable noun (report, meeting, patient, form) almost always needs <b>a/an</b>, <b>the</b>, or a word like <b>my/this/each</b> in front of it.</p>
`,
quiz:[
{q:"Please could you send me ___ agenda before the meeting?", opts:["a","an","the","(nothing)"], a:1, why:"Agenda starts with a vowel sound, and it's the first mention — so “an agenda”."},
{q:"I spoke to ___ ward manager you mentioned yesterday.", opts:["a","an","the","(nothing)"], a:2, why:"You both know exactly which manager — “the ward manager you mentioned”."},
{q:"She has ___ MSc in public health.", opts:["a","an","the","(nothing)"], a:1, why:"MSc is pronounced “em-es-see” — it starts with a vowel sound, so “an MSc”."},
{q:"___ good communication is essential on the ward.", opts:["A","An","The","(nothing)"], a:3, why:"“Communication” is uncountable and we mean it in general — no article needed."},
{q:"It took me ___ hour to finish the audit.", opts:["a","an","the","(nothing)"], a:1, why:"The h in “hour” is silent — it starts with a vowel sound: “an hour”."},
{q:"Which sentence is correct?", opts:["I attached report for your review.","I attached the report for your review.","I attached a the report for your review."], a:1, why:"“Report” is singular and specific (you both know which one), so it needs “the”. Never stack two articles."},
]},

{
id:"prepositions", icon:"📍", color:"violet", title:"In, on, at — time & place",
blurb:"Stop guessing which little word to use.",
body:`
<p>Think of <b>in / on / at</b> as zooming in: <b>in</b> a big space or period → <b>on</b> a surface or day → <b>at</b> an exact point.</p>
<h3>Time</h3>
<table class="extable"><tr><th>Word</th><th>Use for</th><th>Examples</th></tr>
<tr><td><b>in</b></td><td>months, years, seasons, parts of day</td><td>in July, in 2026, in the morning</td></tr>
<tr><td><b>on</b></td><td>days and dates</td><td>on Monday, on 3 May, on my birthday</td></tr>
<tr><td><b>at</b></td><td>clock times, exact points</td><td>at 9 a.m., at noon, at night, at the weekend (UK)</td></tr></table>
<h3>Place</h3>
<table class="extable"><tr><th>Word</th><th>Use for</th><th>Examples</th></tr>
<tr><td><b>in</b></td><td>enclosed spaces, cities, countries</td><td>in the office, in London, in the UK</td></tr>
<tr><td><b>on</b></td><td>surfaces, floors, transport</td><td>on the desk, on the third floor, on the bus, on the ward</td></tr>
<tr><td><b>at</b></td><td>specific points, events, addresses</td><td>at reception, at the meeting, at work</td></tr></table>
<h3>The ones people mix up</h3>
<span class="goodline">✓ The meeting is <b>on</b> Tuesday <b>at</b> 2 p.m. <b>in</b> Room 4.</span>
<span class="badline">✗ <s>I will discuss it with you on Monday morning at the office in 9 a.m.</s></span>
<span class="goodline">✓ I will discuss it with you <b>on</b> Monday morning <b>at</b> the office <b>at</b> 9 a.m.</span>
<p>Handy extras for work: <b>on</b> annual leave, <b>on</b> call, <b>at</b> short notice, <b>in</b> a meeting, deadline <b>on</b> Friday, back <b>in</b> ten minutes.</p>
`,
quiz:[
{q:"The training session is ___ Thursday ___ 10 a.m.", opts:["in / at","on / at","at / on","on / in"], a:1, why:"Days take “on”; clock times take “at”: on Thursday at 10 a.m."},
{q:"I'll be ___ annual leave next week.", opts:["in","on","at"], a:1, why:"The fixed phrase is “on annual leave” (also: on call, on duty, on a break)."},
{q:"She's ___ a meeting right now — can I take a message?", opts:["in","on","at"], a:0, why:"You are “in a meeting” while it happens; you are “at a meeting” to say where you are."},
{q:"I started working here ___ 2021.", opts:["in","on","at"], a:0, why:"Years take “in”: in 2021, in March, in the summer."},
{q:"Leave the forms ___ my desk, please.", opts:["in","on","at"], a:1, why:"A desk top is a surface — “on my desk”."},
{q:"Which sentence is correct?", opts:["See you at Monday in the clinic.","See you on Monday at the clinic.","See you in Monday on the clinic."], a:1, why:"Day → on Monday; specific place/point → at the clinic."},
]},

{
id:"perfect", icon:"⏳", color:"violet", title:"Past simple vs present perfect",
blurb:"“I worked” or “I have worked”? Finally clear.",
body:`
<p>This is the tense pair UK colleagues use constantly — and the difference is about <b>whether the time is finished</b>.</p>
<h3>Past simple — finished time</h3>
<p>Use it when the action sits in a closed time period, often with <i>yesterday, last week, in 2021, two hours ago</i>.</p>
<span class="goodline">✓ I <b>moved</b> to the UK in 2021.</span>
<span class="goodline">✓ I <b>sent</b> the report yesterday.</span>
<h3>Present perfect — connected to now</h3>
<p>Use <b>have/has + past participle</b> when the time is open or the result matters now. Signal words: <i>already, yet, just, ever, never, since, for, so far, recently</i>.</p>
<span class="goodline">✓ I <b>have been</b> in the UK <b>for</b> five years. <i>(and I'm still here)</i></span>
<span class="goodline">✓ I <b>have just sent</b> the report. <i>(hot news — it's in your inbox now)</i></span>
<span class="goodline">✓ <b>Have</b> you <b>ever given</b> a lecture? <i>(any time in your life up to now)</i></span>
<h3>For vs since</h3>
<p><b>For</b> + a length of time (for five years, for two hours). <b>Since</b> + a starting point (since 2021, since Monday, since I arrived).</p>
<h3>The classic slip</h3>
<span class="badline">✗ <s>I am here since five years.</s> / <s>I am working here since 2021.</s></span>
<span class="goodline">✓ I <b>have been</b> here <b>for</b> five years. / I <b>have worked</b> here <b>since</b> 2021.</span>
<span class="badline">✗ <s>I have seen him yesterday.</s> <i>(“yesterday” is finished time → past simple)</i></span>
<span class="goodline">✓ I <b>saw</b> him yesterday.</span>
`,
quiz:[
{q:"I ___ in the UK for nearly five years.", opts:["am","was","have been","have be"], a:2, why:"Started in the past, still true now → present perfect: “have been … for five years”."},
{q:"She ___ the handover notes an hour ago.", opts:["has written","wrote","has wrote","writes"], a:1, why:"“An hour ago” is a finished time — past simple: “wrote”."},
{q:"___ you ever presented at a conference?", opts:["Did","Have","Do","Were"], a:1, why:"Any time in your life up to now → present perfect: “Have you ever presented…?”"},
{q:"I've worked on this ward ___ 2022.", opts:["for","since","from","during"], a:1, why:"“Since” + starting point (2022); “for” + length of time (three years)."},
{q:"Sorry, I ___ your email — my inbox was overflowing!", opts:["have just seen","just see","have seen yesterday","am just seeing"], a:0, why:"Hot news with a result now → “I have just seen your email”."},
{q:"Which sentence is correct?", opts:["I have visited Manila last December.","I visited Manila last December.","I am visiting Manila last December."], a:1, why:"“Last December” is closed, finished time — use past simple: “visited”."},
]},

{
id:"agreement", icon:"🤝", color:"violet", title:"Subject–verb agreement",
blurb:"He works, they work — and the tricky ones between.",
body:`
<p>The rule is simple — one thing takes <b>-s</b> (she work<b>s</b>), many things don't (they work). The slips happen when the subject is hard to spot.</p>
<h3>Don't be distracted by the words in between</h3>
<span class="badline">✗ <s>One of my colleagues are off sick.</s></span>
<span class="goodline">✓ <b>One</b> of my colleagues <b>is</b> off sick. <i>(the subject is “one”)</i></span>
<span class="goodline">✓ The <b>list</b> of action points <b>is</b> attached. <i>(subject: list, not points)</i></span>
<h3>Words that look plural but act singular</h3>
<p><b>Everyone, everybody, each, either, nobody, something</b> all take a singular verb.</p>
<span class="goodline">✓ Everyone <b>is</b> welcome. Each patient <b>has</b> a named nurse.</span>
<h3>Uncountable nouns are singular</h3>
<span class="goodline">✓ The information <b>is</b> correct. The equipment <b>was</b> delivered. Your feedback <b>is</b> helpful.</span>
<h3>Team, staff, management</h3>
<p>In UK English, group nouns can be singular or plural — just be consistent: “The team <b>is</b> meeting” and “the team <b>are</b> happy” are both heard. <b>Staff</b> usually takes a plural verb: “The staff <b>are</b> tired.”</p>
<h3>There is / there are</h3>
<span class="goodline">✓ There <b>is</b> a problem. / There <b>are</b> two problems.</span>
<span class="badline">✗ <s>There's three forms to complete.</s> <i>(fine in speech, avoid in writing)</i></span>
`,
quiz:[
{q:"One of the printers ___ broken again.", opts:["are","is","were","be"], a:1, why:"The subject is “one” (singular), not “printers” — “one … is broken”."},
{q:"Everyone ___ invited to the away day.", opts:["are","were","is","have been"], a:2, why:"“Everyone” is singular: everyone is, everyone has, everyone wants."},
{q:"The information you sent ___ really useful.", opts:["were","are","is","have been"], a:2, why:"“Information” is uncountable and singular: the information is useful."},
{q:"There ___ several issues with the new rota.", opts:["is","are","was","be"], a:1, why:"“Several issues” is plural → “there are several issues”."},
{q:"The list of attendees ___ on the shared drive.", opts:["are","is","were","being"], a:1, why:"The subject is “list” (singular) — the phrase “of attendees” doesn't change it."},
{q:"Which sentence is correct?", opts:["Each of the wards have a fire warden.","Each of the wards has a fire warden.","Each of the ward have a fire warden."], a:1, why:"“Each” is singular: each … has. (And it's “each of the wards”, plural after “of the”.)"},
]},

{
id:"countable", icon:"🧮", color:"violet", title:"Countable & uncountable",
blurb:"Advice, information, equipment — and much vs many.",
body:`
<p>Some English nouns refuse to be counted. You can't say <s>two advices</s> — advice is a substance, like water. Getting these right instantly lifts your writing.</p>
<h3>The big uncountables at work</h3>
<p><b>advice · information · feedback · equipment · training · research · evidence · progress · work · staff (as a body) · furniture · knowledge</b></p>
<span class="badline">✗ <s>Thank you for your advices. I received many informations.</s></span>
<span class="goodline">✓ Thank you for your <b>advice</b>. I received <b>a lot of information</b>.</span>
<p>Need to count one? Use <b>a piece of</b> advice, <b>an item of</b> equipment, <b>a training session</b>.</p>
<h3>Much, many, a lot of</h3>
<table class="extable"><tr><th>Use</th><th>With</th><th>Example</th></tr>
<tr><td><b>many</b></td><td>countable plurals</td><td>How many patients? Not many chairs.</td></tr>
<tr><td><b>much</b></td><td>uncountables</td><td>How much time? Not much information.</td></tr>
<tr><td><b>a lot of</b></td><td>both (safe choice)</td><td>a lot of patients, a lot of time</td></tr></table>
<h3>Fewer vs less</h3>
<span class="goodline">✓ <b>Fewer</b> beds, <b>fewer</b> errors <i>(you can count them)</i></span>
<span class="goodline">✓ <b>Less</b> time, <b>less</b> paperwork <i>(you can't)</i></span>
<h3>Some & any</h3>
<p><b>Some</b> in positive sentences and offers; <b>any</b> in negatives and most questions: “I have <b>some</b> feedback.” “I don't have <b>any</b> questions.” “Do you have <b>any</b> concerns?”</p>
`,
quiz:[
{q:"Could you give me some ___ about the new referral system?", opts:["informations","information","informs","information's"], a:1, why:"“Information” is uncountable — it never takes an s."},
{q:"How ___ time do we have for questions?", opts:["many","much","lot","few"], a:1, why:"Time is uncountable → “how much time”. Countables take “many” (how many minutes)."},
{q:"We need ___ staff on nights this winter.", opts:["much","more","a more","many more of"], a:1, why:"“More” works with both countable and uncountable nouns — “more staff”."},
{q:"There are ___ errors in this draft than the last one. Well done!", opts:["less","fewer","lesser","few"], a:1, why:"Errors can be counted → “fewer errors”. “Less” is for uncountables (less noise)."},
{q:"She gave me a useful piece of ___ before my presentation.", opts:["advices","advise","advice","advising"], a:2, why:"“A piece of advice” — advice is the noun; advise (with s sound) is the verb."},
{q:"Which sentence is correct?", opts:["The new equipments have arrived.","The new equipment has arrived.","The new equipment have arrived."], a:1, why:"“Equipment” is uncountable and singular: the equipment has arrived."},
]},

{
id:"questions", icon:"❓", color:"violet", title:"Questions & word order",
blurb:"Direct questions, polite indirect ones, and where words go.",
body:`
<p>English questions need a helper verb and a fixed order. And in polite workplace English, we often wrap the question inside another sentence — which changes the order again.</p>
<h3>Direct questions: QASV</h3>
<p><b>Q</b>uestion word → <b>A</b>uxiliary → <b>S</b>ubject → <b>V</b>erb.</p>
<span class="goodline">✓ <b>Where do</b> you keep the spare forms?</span>
<span class="goodline">✓ <b>What time does</b> the clinic open?</span>
<span class="badline">✗ <s>Where you keep the forms?</s> / <s>What time the clinic opens?</s></span>
<h3>Indirect questions: back to normal order</h3>
<p>After openers like <i>Could you tell me… / Do you know… / I was wondering…</i>, the word order goes back to a normal statement — and drop do/does/did.</p>
<span class="goodline">✓ Could you tell me <b>where you keep</b> the forms?</span>
<span class="goodline">✓ Do you know <b>what time the clinic opens</b>?</span>
<span class="badline">✗ <s>Could you tell me where do you keep the forms?</s></span>
<p>Indirect questions sound noticeably more polite in emails — perfect for asking managers or people you don't know well.</p>
<h3>Adverbs: where does “always” go?</h3>
<p>Frequency adverbs (always, usually, often, never) go <b>before</b> the main verb but <b>after</b> “be”.</p>
<span class="goodline">✓ I <b>usually check</b> emails at 8. / She <b>is always</b> on time.</span>
<span class="badline">✗ <s>I check usually emails at 8.</s></span>
`,
quiz:[
{q:"Which is the correct direct question?", opts:["Why the meeting was cancelled?","Why was the meeting cancelled?","Why the meeting cancelled was?"], a:1, why:"Question word + auxiliary + subject: “Why was the meeting cancelled?”"},
{q:"Could you tell me ___?", opts:["when does the audit start","when the audit starts","when starts the audit"], a:1, why:"Indirect questions use normal statement order: “…when the audit starts”."},
{q:"___ she work weekends?", opts:["Do","Is","Does","Has"], a:2, why:"Third person singular questions take “does”: Does she work weekends?"},
{q:"Do you know ___ the incident form is saved?", opts:["where","where does","where is","that where"], a:0, why:"“Do you know where the incident form is saved?” — no extra auxiliary inside."},
{q:"Choose the correct sentence:", opts:["She always is polite with relatives.","She is always polite with relatives.","Always she is polite with relatives."], a:1, why:"Frequency adverbs come after the verb “be”: she is always polite."},
{q:"Which is the most polite way to ask a senior colleague?", opts:["Where is the audit data?","Tell me where the audit data is.","Could you tell me where the audit data is?"], a:2, why:"Indirect questions (“Could you tell me…”) soften the request — ideal for email."},
]},

{
id:"modals", icon:"🎩", color:"violet", title:"Could, would, might — polite power",
blurb:"The secret of sounding professional, not pushy.",
body:`
<p>British workplace English runs on <b>softening</b>. The grammar of politeness is mostly modal verbs — could, would, may, might — plus a few magic phrases.</p>
<h3>Requests: climb the politeness ladder</h3>
<table class="extable"><tr><th>Level</th><th>Sounds like</th></tr>
<tr><td>Direct</td><td>Send me the rota.</td></tr>
<tr><td>Neutral</td><td>Can you send me the rota?</td></tr>
<tr><td>Polite</td><td><b>Could</b> you send me the rota, please?</td></tr>
<tr><td>Extra polite</td><td><b>Would you mind</b> send<b>ing</b> me the rota?</td></tr>
<tr><td>Formal email</td><td><b>I would be grateful if you could</b> send me the rota.</td></tr></table>
<p>⚠️ After <b>Would you mind…</b> use the <b>-ing</b> form: “Would you mind checking…?” — and the polite answer to it is “Not at all” (= yes, I'll do it!).</p>
<h3>Suggestions & opinions, softly</h3>
<span class="goodline">✓ We <b>could</b> try moving the meeting. / It <b>might</b> be worth reviewing the rota.</span>
<span class="goodline">✓ I <b>would suggest</b> starting with the audit. / Perhaps we <b>should</b> ask pharmacy.</span>
<span class="badline">✗ <s>You must change the rota.</s> <i>(very strong — keep “must” for rules and safety)</i></span>
<h3>Permission & offers</h3>
<span class="goodline">✓ <b>May I</b> leave five minutes early? / <b>Could I</b> take Friday off?</span>
<span class="goodline">✓ <b>Shall I</b> book the room? / <b>Would you like</b> me to draft the reply?</span>
`,
quiz:[
{q:"Would you mind ___ the door? It's quite noisy.", opts:["to close","close","closing","closed"], a:2, why:"“Would you mind” is always followed by the -ing form: “closing”."},
{q:"Pick the most email-appropriate request to a manager:", opts:["Send me the figures today.","I would be grateful if you could send me the figures today.","You must send me the figures today."], a:1, why:"“I would be grateful if you could…” is the classic polite formal request."},
{q:"It ___ be worth double-checking the dosage table before we print.", opts:["might","must","can't","need"], a:0, why:"“It might be worth + -ing” politely suggests without ordering anyone."},
{q:"___ I take next Friday as annual leave?", opts:["Must","Could","Would","Shall"], a:1, why:"“Could I…?” politely asks permission. (“Shall I…?” offers to do something.)"},
{q:"___ I book the meeting room for us?", opts:["Would","Am","Shall","Do"], a:2, why:"“Shall I…?” is the natural way to offer to do something helpful."},
{q:"Your colleague asks “Would you mind covering my break?” You're happy to help. You say:", opts:["Yes, I would.","Not at all.","I mind."], a:1, why:"“Not at all” = I don't mind = happy to help. Answering “yes” literally means you object!"},
]},

{
id:"confuse1", icon:"👯", color:"violet", title:"Confusables I — the classics",
blurb:"Its/it's, their/there, then/than, affect/effect.",
body:`
<p>These pairs sound identical but mean different things — spellcheck won't save you, because both spellings are real words.</p>
<h3>its vs it's</h3>
<p><b>it's</b> = it is / it has. <b>its</b> = belonging to it. Test: read it aloud as “it is” — if the sentence still works, use the apostrophe.</p>
<span class="goodline">✓ <b>It's</b> been a long shift. The trust updated <b>its</b> policy.</span>
<h3>their / there / they're</h3>
<p><b>their</b> = belonging to them · <b>there</b> = a place / “there is” · <b>they're</b> = they are.</p>
<span class="goodline">✓ <b>They're</b> bringing <b>their</b> laptops over <b>there</b>.</span>
<h3>then vs than</h3>
<p><b>then</b> = time or sequence · <b>than</b> = comparison.</p>
<span class="goodline">✓ Finish the notes, <b>then</b> go home. This template is clearer <b>than</b> the old one.</span>
<h3>affect vs effect</h3>
<p><b>Affect</b> is usually the verb (to change something); <b>effect</b> is usually the noun (the result). Memory hook: <b>A</b>ffect = <b>A</b>ction, <b>E</b>ffect = <b>E</b>nd result.</p>
<span class="goodline">✓ The delay didn't <b>affect</b> patients. The new rota had a positive <b>effect</b>.</span>
<h3>your vs you're · to/too/two · lose/loose</h3>
<span class="goodline">✓ <b>You're</b> presenting after <b>your</b> break.</span>
<span class="goodline">✓ It's <b>too</b> late <b>to</b> book <b>two</b> rooms.</span>
<span class="goodline">✓ Don't <b>lose</b> the key — the handle is <b>loose</b>.</span>
`,
quiz:[
{q:"___ been a busy morning on the unit.", opts:["Its","It's","Its'"], a:1, why:"“It's been” = “It has been” — the apostrophe version. “Its” shows belonging."},
{q:"The department reviewed ___ visiting policy.", opts:["it's","its","its'"], a:1, why:"Belonging to the department → “its policy”, no apostrophe."},
{q:"This draft reads much better ___ the first one.", opts:["then","than","that"], a:1, why:"A comparison → “than”. “Then” is for time: “first this, then that”."},
{q:"Will the roadworks ___ your commute?", opts:["effect","affect","affects"], a:1, why:"You need the verb (to change something) → “affect”. The noun is “effect”."},
{q:"___ waiting for the results of ___ blood tests.", opts:["Their / they're","They're / their","There / their"], a:1, why:"“They're waiting” (they are) … “their blood tests” (belonging to them)."},
{q:"Which sentence is correct?", opts:["Your going to love the new tea room.","You're going to love the new tea room.","Youre going to love the new tea room."], a:1, why:"“You're” = you are. “Your” shows possession: your mug, your desk."},
]},

{
id:"confuse2", icon:"🎭", color:"violet", title:"Confusables II — verb traps",
blurb:"Borrow/lend, say/tell, do/make, bring/take.",
body:`
<p>These verb pairs trip up even confident speakers, because many languages use one word where English insists on two.</p>
<h3>borrow vs lend</h3>
<p>You <b>borrow</b> something <i>from</i> someone (you take it). You <b>lend</b> something <i>to</i> someone (you give it, temporarily).</p>
<span class="goodline">✓ Could I <b>borrow</b> your charger? / Could you <b>lend</b> me your charger?</span>
<span class="badline">✗ <s>Can you borrow me your pen?</s></span>
<h3>say vs tell</h3>
<p><b>Tell</b> needs a person straight after it; <b>say</b> doesn't.</p>
<span class="goodline">✓ She <b>told me</b> the clinic was cancelled. / She <b>said</b> the clinic was cancelled.</span>
<span class="badline">✗ <s>She said me the clinic was cancelled.</s> / <s>She told that…</s></span>
<h3>do vs make</h3>
<p>Rough rule: <b>do</b> = work, tasks, duties · <b>make</b> = create or produce something new.</p>
<table class="extable"><tr><th>do</th><th>make</th></tr>
<tr><td>do the audit, do your best, do overtime, do the washing-up, do a course</td><td>make a decision, make a mistake, make an appointment, make progress, make a suggestion, make tea</td></tr></table>
<h3>bring vs take · remember vs remind</h3>
<p><b>Bring</b> = towards the speaker; <b>take</b> = away. <b>Remember</b> yourself; <b>remind</b> someone else.</p>
<span class="goodline">✓ Please <b>bring</b> your ID badge to the session. I'll <b>take</b> these notes back to the office.</span>
<span class="goodline">✓ I must <b>remember</b> to reply. Please <b>remind me</b> to reply.</span>
`,
quiz:[
{q:"Could you ___ me your stapler for a minute?", opts:["borrow","lend","loan me from"], a:1, why:"You give it → lend. I take it → borrow: “Could you lend me…” = “Could I borrow…”."},
{q:"He ___ me the results would be ready by Friday.", opts:["said","told","said to"], a:1, why:"A person comes straight after → “told me”. Without a person: “He said the results…”."},
{q:"We need to ___ a decision about the rota today.", opts:["do","make","take up"], a:1, why:"It's “make a decision” — decisions, mistakes, suggestions and appointments are all made."},
{q:"I did three night shifts, so I've ___ a lot of overtime this month.", opts:["made","done","taken"], a:1, why:"Work and tasks take “do”: do overtime, do an audit, do a course."},
{q:"Please ___ me to send the minutes after lunch.", opts:["remember","remind","memorise"], a:1, why:"Someone else prompts you → “remind me”. You do it yourself → “I'll remember”."},
{q:"Which sentence is correct?", opts:["Don't forget to bring your certificate to the interview tomorrow.","Don't forget to borrow your certificate to the interview tomorrow.","Don't forget to say them your certificate at the interview."], a:0, why:"“Bring” = carry it with you to the place you're going. The others misuse borrow/say."},
]},

{
id:"punctuation", icon:"✒️", color:"violet", title:"Punctuation that earns respect",
blurb:"Commas, apostrophes, capitals — and the run-on cure.",
body:`
<p>Punctuation is body language for writing. A few habits cover 90% of what emails need.</p>
<h3>The run-on cure</h3>
<p>Two complete sentences can't be glued with just a comma. Use a full stop, a semicolon, or a linking word.</p>
<span class="badline">✗ <s>I reviewed the notes, the dosage was wrong.</s></span>
<span class="goodline">✓ I reviewed the notes<b>.</b> The dosage was wrong.</span>
<span class="goodline">✓ I reviewed the notes<b>, and</b> the dosage was wrong.</span>
<h3>Commas that matter</h3>
<p>After an opening phrase; around extra information; in lists.</p>
<span class="goodline">✓ <b>After the meeting,</b> I'll circulate the notes.</span>
<span class="goodline">✓ Dr Reyes<b>, our new registrar,</b> starts Monday.</span>
<span class="goodline">✓ Please bring your badge<b>,</b> laptop <b>and</b> charger.</span>
<h3>Apostrophes: two jobs only</h3>
<p>1) Missing letters: don't, it's, we're. 2) Belonging: the nurse's rota (one nurse), the nurses' rota (many nurses). <b>Never</b> for plurals!</p>
<span class="badline">✗ <s>Update's, photo's, the 1990's, two patient's</s></span>
<span class="goodline">✓ updates, photos, the 1990s, two patients</span>
<h3>Capital letters</h3>
<p>Names, places, days, months, titles before names (Dr Cruz), and the word I. Not for seasons, job roles in general, or emphasis. WRITING IN CAPS READS AS SHOUTING.</p>
<h3>Exclamation marks</h3>
<p>Maximum one per email — and ideally zero in formal messages. Full stops feel calm and confident.</p>
`,
quiz:[
{q:"Which is punctuated correctly?", opts:["The audit is complete, the results look good.","The audit is complete. The results look good.","The audit is complete the results look good."], a:1, why:"Two complete sentences need a full stop (or a linking word) — a comma alone can't join them."},
{q:"Choose the correct apostrophe use:", opts:["Both nurse's completed they're training.","Both nurses completed their training.","Both nurses' completed their training."], a:1, why:"“Nurses” is just a plural — no apostrophe. Apostrophes mark missing letters or possession only."},
{q:"Which greeting line is punctuated in standard UK style?", opts:["Dear Dr Patel,","dear dr patel,","Dear dr. Patel;"], a:0, why:"Capital D on Dear, capital on the title and name, and a comma at the end."},
{q:"“The team met on ___ to plan the ___ conference.”", opts:["friday / summer","Friday / summer","Friday / Summer"], a:1, why:"Days are capitalised (Friday); seasons are not (summer)."},
{q:"Which shows that one manager owns the office?", opts:["the managers office","the manager's office","the managers' office"], a:1, why:"One manager → apostrophe before the s: the manager's office."},
{q:"The best number of exclamation marks in a formal email is…", opts:["One per paragraph — friendly!","As many as needed!!","Zero or one in the whole email"], a:2, why:"Formal UK emails stay calm: full stops carry authority; save “!” for genuine warmth."},
]},

{
id:"linkers", icon:"🔗", color:"violet", title:"Linking words — flow like a native",
blurb:"However, therefore, although — connect ideas smoothly.",
body:`
<p>Linking words are the signposts of writing. Used well, they make emails and reports feel effortless to read.</p>
<h3>Adding & contrasting</h3>
<table class="extable"><tr><th>Job</th><th>Words</th><th>Example</th></tr>
<tr><td>Add</td><td>also, in addition, furthermore</td><td>In addition, we reviewed the fridge logs.</td></tr>
<tr><td>Contrast</td><td>however, although, despite</td><td>However, two forms were missing.</td></tr>
<tr><td>Result</td><td>therefore, as a result, so</td><td>Therefore, I have updated the checklist.</td></tr>
<tr><td>Example</td><td>for example, such as</td><td>…key metrics, such as waiting times.</td></tr></table>
<h3>However — the comma trap</h3>
<p><b>However</b> starting a sentence takes a comma after it. It cannot glue two sentences with just commas.</p>
<span class="badline">✗ <s>The clinic was busy, however, we saw everyone.</s></span>
<span class="goodline">✓ The clinic was busy. <b>However,</b> we saw everyone.</span>
<span class="goodline">✓ The clinic was busy<b>;</b> however, we saw everyone.</span>
<h3>Although vs despite</h3>
<p><b>Although</b> + a full clause (subject + verb). <b>Despite</b> + a noun or -ing.</p>
<span class="goodline">✓ <b>Although</b> we were short-staffed, we finished on time.</span>
<span class="goodline">✓ <b>Despite</b> the shortage / <b>Despite</b> being short-staffed, we finished on time.</span>
<span class="badline">✗ <s>Despite we were short-staffed…</s></span>
<h3>Don't overdo it</h3>
<p>One linker per sentence is plenty. Short sentences with the occasional “however” read better than long chains of “moreover… furthermore… nevertheless…”.</p>
`,
quiz:[
{q:"The ward was full. ___, no appointments were cancelled.", opts:["Despite","However","Although"], a:1, why:"A new sentence contrasting the last one → “However,” + comma."},
{q:"___ the heavy workload, the team hit every target.", opts:["Although","However","Despite"], a:2, why:"“Despite” + noun phrase (the heavy workload). “Although” would need a full clause."},
{q:"___ we started late, we still covered the whole agenda.", opts:["Despite","Although","Therefore"], a:1, why:"A full clause follows (we started late) → “Although”."},
{q:"Two fridges failed overnight. ___, all vaccines were moved to the pharmacy.", opts:["As a result","In addition","For example"], a:0, why:"The second sentence is the consequence of the first → “As a result”."},
{q:"We track several metrics, ___ waiting times and readmissions.", opts:["however","such as","therefore"], a:1, why:"You're giving examples of the metrics → “such as”."},
{q:"Which sentence is correct?", opts:["The results were late, however we proceeded.","The results were late; however, we proceeded.","The results were late however, we proceeded."], a:1, why:"“However” joining two sentences needs a semicolon before it and a comma after."},
]},
];

{
id:"leaflet", icon:"💊", title:"Patient leaflet: after your procedure",
blurb:"Instructional writing — clear, calm, and direct.",
text:`
<h3>Going home after your day-case procedure</h3>
<p>You have had a procedure under sedation. Although you may feel alert, the medicine stays in your body for up to 24 hours and can slow your reactions without you noticing.</p>
<p><b>For the next 24 hours, please do not:</b> drive or cycle; operate machinery; sign legal documents; drink alcohol; or be the only adult caring for small children.</p>
<p>You should arrange for a responsible adult to take you home and stay with you overnight. Most people feel back to normal by the following day, but everyone recovers at a different pace, so do not be concerned if you feel tired for a little longer.</p>
<p>Eat light meals for the rest of today and drink plenty of fluids. You may remove the dressing tomorrow morning and shower as usual. A small amount of bruising around the site is common and should fade within a week.</p>
<p><b>Contact the unit</b> on the number below if you notice increasing pain, swelling, bleeding that does not stop with gentle pressure, or a temperature above 38°C. In an emergency, call 999.</p>`,
vocab:[
{w:"sedation", def:"medicine that makes you relaxed and sleepy during a procedure — lighter than general anaesthetic."},
{w:"operate machinery", def:"use powered equipment or tools — forbidden after sedation because reactions are slower."},
{w:"responsible adult", def:"a grown-up who can look after you and act sensibly if something goes wrong."},
{w:"dressing", def:"the protective covering placed over a wound."},
{w:"fade", def:"to gradually disappear or become less visible — bruises fade over days."},
],
quiz:[
{q:"Why must patients avoid driving for 24 hours?", opts:["It is against the law after any procedure","Sedation can slow reactions without the patient noticing","The dressing makes it uncomfortable"], a:1, why:"“The medicine stays in your body for up to 24 hours and can slow your reactions without you noticing.”"},
{q:"What should the patient do about the dressing?", opts:["Keep it on for a week","Remove it tomorrow morning","Remove it before bed tonight"], a:1, why:"“You may remove the dressing tomorrow morning and shower as usual.”"},
{q:"Which symptom means the patient should contact the unit?", opts:["A small bruise near the site","Feeling tired the next day","A temperature above 38°C"], a:2, why:"Bruising and tiredness are described as normal; a temperature above 38°C is on the contact list."},
{q:"The tone of this leaflet is best described as…", opts:["Calm and reassuring, with clear rules","Strict and legal","Casual and chatty"], a:0, why:"It mixes firm safety instructions (“please do not”) with reassurance (“do not be concerned”). That balance is the leaflet style to copy."},
]},

text:`

<p><b>Present:</b> A. Cruz (chair), J. Okafor, L. Reyes, M. Whitfield. <b>Apologies:</b> S. Devi.</p>
<p><b>1. Matters arising.</b> The action from June — updating the falls poster — has been completed. All other actions were closed.</p>
<p><b>2. Incident review.</b> JO presented the monthly figures. Reported incidents rose from 12 to 15; however, the increase was attributed to better reporting rather than more harm. Two medication near-misses were discussed, and it was agreed that the double-checking procedure would be re-circulated to all staff.</p>
<p><b>3. Audit update.</b> The hand hygiene audit achieved 94% compliance, up from 89%. LR was congratulated on leading the drive. It was noted that night shifts remain below target; LR to arrange additional dispensers by the rear station. <b>Action: LR, by 31 July.</b></p>
<p><b>4. Any other business.</b> MW raised the broken hoist in bay 3; estates have been informed and repair is expected this week.</p>
<p><b>Date of next meeting:</b> 11 August, 2 p.m., seminar room.</p>`,

{w:"apologies", def:"in minutes, the list of people who told the meeting in advance that they could not attend."},
{w:"near-miss", def:"an error that was caught before it caused harm — important to report and learn from."},
{w:"compliance", def:"the extent to which people follow a rule or standard, often shown as a percentage."},
{w:"any other business (AOB)", def:"the final agenda slot for topics not on the printed agenda."},
],
quiz:[
{q:"Why did reported incidents rise from 12 to 15?", opts:["More harm occurred on the ward","Better reporting was believed to be the cause","The figures were miscounted"], a:1, why:"“The increase was attributed to better reporting rather than more harm.”"},
{q:"Who must arrange extra dispensers, and by when?", opts:["J. Okafor, by 11 August","L. Reyes, by 31 July","A. Cruz, this week"], a:1, why:"“LR to arrange additional dispensers… Action: LR, by 31 July.” Initials in minutes point back to the names at the top."},
{q:"What does “Apologies: S. Devi” mean?", opts:["S. Devi said sorry for a mistake","S. Devi could not attend and sent notice","S. Devi arrived late"], a:1, why:"“Apologies” in minutes = advance notice of absence, nothing to do with saying sorry."},
{q:"What happened about the broken hoist?", opts:["It was repaired during the meeting","Estates were informed; repair expected this week","It was added to next month's agenda"], a:1, why:"“Estates have been informed and repair is expected this week.”"},

{
id:"news", icon:"📰", title:"News brief: winter pressures",
blurb:"Newspaper style — dense sentences, formal vocabulary.",
text:`
<h3>Hospitals urged to plan earlier as winter pressures mount</h3>
<p>Health leaders have called on trusts to begin winter planning months earlier than usual, warning that a combination of rising flu admissions and workforce shortages could leave services stretched to capacity by December.</p>
<p>In previous years, escalation plans were typically finalised in late autumn. This year, national guidance asks every trust to identify additional surge capacity, confirm staffing for extra beds, and set out how routine operations will be protected if demand spikes.</p>
<p>The guidance also places new emphasis on keeping people well at home. Trusts are expected to expand virtual wards, which allow selected patients to be monitored remotely, and to work with community teams so that patients who are medically fit are discharged without delay.</p>
<p>Frontline staff broadly welcomed the earlier start but cautioned that plans alone would not solve underlying gaps. “You cannot open beds without people,” one senior nurse said. “Recruitment and retention remain the real challenge.”</p>`,
vocab:[
{w:"urged", def:"strongly encouraged — a common newspaper verb: “urged to plan” = told firmly they should plan."},
{w:"stretched to capacity", def:"working at the absolute limit of what the service can handle."},
{w:"surge capacity", def:"extra beds and staff that can be opened quickly when demand suddenly rises."},
{w:"discharged", def:"officially allowed to leave hospital when treatment is complete."},
{w:"retention", def:"keeping existing staff in their jobs, rather than losing them to other employers."},
],
quiz:[
{q:"What are trusts being asked to do differently this year?", opts:["Cancel routine operations in winter","Start winter planning much earlier","Close virtual wards"], a:1, why:"Health leaders “called on trusts to begin winter planning months earlier than usual”."},
{q:"What is a “virtual ward”?", opts:["A ward run entirely by agency staff","A system for monitoring selected patients at home","An online training programme"], a:1, why:"The article defines it: virtual wards “allow selected patients to be monitored remotely”."},
{q:"How did frontline staff respond to the guidance?", opts:["They rejected it completely","They welcomed it but pointed to staffing gaps","They asked for it to be delayed"], a:1, why:"“Broadly welcomed… but cautioned that plans alone would not solve underlying gaps.”"},
{q:"“You cannot open beds without people” refers to which problem?", opts:["Recruitment and retention of staff","A shortage of physical beds","Delayed discharges"], a:0, why:"The quote is about workforce: hiring staff and keeping them (“recruitment and retention remain the real challenge”)."},
]},
];

/* ================================================================
   FIX THE SENTENCE — rewrite drills
   ================================================================ */
const FIXES = [
{bad:"Please revert back to me at the earliest.", opts:["Please revert back at your soonest.","Please reply as soon as you can.","Please do the needful and revert."], a:1, why:"“Revert back” is non-standard in UK English — “reply” or “get back to me” is what colleagues expect."},
{bad:"I am writing this email to you because I wanted to ask if it would be okay to maybe take a half day.", opts:["Could I take a half day on Friday?","This email concerns the taking of a half day by myself.","I write to enquire regarding half-day possibilities."], a:0, why:"Twenty-two words melt down to seven. Polite ≠ long: one clear question is the politest thing you can send."},
{bad:"Me and Jon will attend the training.", opts:["Jon and me will attend the training.","Jon and I will attend the training.","Myself and Jon will attend the training."], a:1, why:"Subjects take “I”: Jon and I will attend. Test it by removing Jon — “I will attend”, never “me will attend”."},
{bad:"Attached herewith please find the requested document for your kind perusal.", opts:["Please find attached herewith the document.","I attach the document — do let me know if you need anything else.","The requested document is enclosed for perusal at your convenience."], a:1, why:"“Herewith”, “perusal” and “kind” are Victorian office English. Modern UK style: “I attach…” or “Please find attached…” and stop."},
{bad:"Its important that every staff bring there own laptop.", opts:["It's important that every staff brings there own laptop.","It's important that all staff bring their own laptops.","Its important that all staffs bring their own laptop."], a:1, why:"Three fixes: it's (= it is), “all staff” (staff is a group noun — “every staff” doesn't work), and “their” for possession."},
{bad:"I look forward to hear from you.", opts:["I look forward to hearing from you.","I am looking forward to hear from you.","I look forward for hearing you."], a:0, why:"“Look forward to” is followed by -ing: looking forward to hearing, to seeing, to meeting."},
{bad:"The meeting has been preponed to 9 a.m.", opts:["The meeting has been preponed earlier to 9 a.m.","The meeting has been brought forward to 9 a.m.","The meeting has been anticipated to 9 a.m."], a:1, why:"“Prepone” isn't used in UK English — meetings are “brought forward” (earlier) or “pushed back” (later)."},
{bad:"Kindly do the needful regarding the broken printer.", opts:["Please could you arrange for the printer to be repaired?","Kindly needful the printer repair.","Do the needful for the printer, please."], a:0, why:"“Do the needful” puzzles UK readers. Say specifically what you want done: arrange a repair."},
{bad:"I have a doubt about the new rota.", opts:["I have a doubt regarding the rota.","I have a question about the new rota.","I am doubting the new rota."], a:1, why:"In UK English, “a doubt” suggests suspicion. For asking things, you have “a question” or you'd like to “check something”."},
{bad:"Thanks God it's Friday, see you at the meeting.", opts:["Thank God it's Friday — see you at the meeting.","Thanks to God it is Friday, see you at the meeting.","Thanks god its friday, see you at the meeting."], a:0, why:"The set phrase is “Thank God” (no s). And the dash joins the two thoughts more cleanly than a comma splice."},
{bad:"Please explain me the new referral process.", opts:["Please explain me about the new referral process.","Please could you explain the new referral process to me?","Please explain to I the new referral process."], a:1, why:"“Explain” never takes a person directly — you explain something *to* someone."},
{bad:"We discussed about the budget in the meeting.", opts:["We discussed about budget in the meeting.","We discussed the budget in the meeting.","We made discussion of the budget in the meeting."], a:1, why:"“Discuss” already contains “about” — you discuss the budget, talk about the budget, but never discuss about."},
];

let VOICE=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();
  VOICE=vs.find(v=>v.lang==="en-GB"&&/sonia|libby|kate|serena|stephanie|martha|female/i.test(v.name))
      ||vs.find(v=>v.lang==="en-GB")
      ||vs.find(v=>(v.lang||"").startsWith("en"))||null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,rate){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  queueSpeak(text,rate);
}
function queueSpeak(text,rate){
  if(!("speechSynthesis" in window))return;
  const u=new SpeechSynthesisUtterance(text.replace(/ \/ /g,", "));
  u.lang="en-GB";if(VOICE)u.voice=VOICE;
  u.rate=rate||store.rate;
  speechSynthesis.speak(u);
}
const SRClass=window.SpeechRecognition||window.webkitSpeechRecognition||null;

/* ---------- clipboard ---------- */
function copyText(t,nearEl){
  const done=()=>{let x=window.innerWidth/2,y=window.innerHeight/2;
    if(nearEl){const r=nearEl.getBoundingClientRect();x=r.left+r.width/2;y=r.top;}
    floatText("Copied ✓",x,y,"#168F4E");};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));}
  else fallbackCopy(t,done);
}
function fallbackCopy(t,done){
  const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done();}catch(e){}
  ta.remove();
}

    const order=shuffle(q.opts.map((t,idx)=>({t:t,idx:idx})));
    let answered=false;const btns=[];
    order.forEach(o=>{
      const b=el("button","opt",o.t);

      b.addEventListener("click",()=>{
        if(answered)return;answered=true;
        btns.forEach(x=>x.disabled=true);
        const ok=o.idx===q.a;
        if(ok){b.classList.add("correct");score++;addXP(xpPer,b);}
        else{b.classList.add("wrong");const c=btns.find(x=>x._idx===q.a);if(c)c.classList.add("reveal");}
        wrap.appendChild(el("div","why",(ok?"<b>✓ Correct!</b> ":"<b>Not quite.</b> ")+q.why));
        const nxt=el("button","btn small",i<qs.length-1?"Next →":"See results ✨");
        nxt.addEventListener("click",()=>{i++;if(i<qs.length){renderQ();wrap.scrollIntoView({block:"start"});}else finish();});
        wrap.appendChild(nxt);
      });
      wrap.appendChild(b);
    });
  }
  function finish(){
    wrap.innerHTML="";
    const pct=score/qs.length;
    if(pct>=0.8)confetti(pct===1?90:50);
    const msg=pct===1?"Perfect score! 🎉":pct>=0.7?"Great work! 💪":"Good effort — review the lesson and try again 🌱";
    const sc=el("div","card scorecard",'<div class="bigscore">'+score+"/"+qs.length+'</div><div class="msg">'+msg+'</div><div class="submsg">+'+(score*xpPer)+" XP earned</div>");
    const again=el("button","btn ghost small","↻ Try again");
    again.addEventListener("click",()=>{i=0;score=0;renderQ();});
    const back=el("button","btn small","Done");
    back.style.marginLeft="10px";
    back.addEventListener("click",closeDetail);
    sc.appendChild(again);sc.appendChild(back);
    wrap.appendChild(sc);
    if(opts.onFinish)opts.onFinish(score,qs.length);
  }
  renderQ();
  return wrap;
}

function openScenario(sc){
  openDetail(sc.icon+" "+sc.title,body=>{
    let i=0,mistakes=0;const lines=[];let subject="";
    const intro=el("div","note","Choose the best line at each step. Your choices build a real email you can copy at the end.");
    body.appendChild(intro);
    const mail=el("div","mailpreview");
    const mpSub=el("div","mp-sub","Subject: …");
    const mpBody=el("div","mp-body","");
    mail.appendChild(mpSub);mail.appendChild(mpBody);
    body.appendChild(mail);
    const stepWrap=el("div");
    body.appendChild(stepWrap);
    function renderStep(){
      stepWrap.innerHTML="";
      const st=sc.steps[i];
      const card=el("div","card");
      card.appendChild(el("div","steplbl","Step "+(i+1)+" of "+sc.steps.length+" · "+st.label));
      card.appendChild(el("div","qtext",st.prompt));
      let answered=false;
      shuffle(st.opts.map(o=>o)).forEach(o=>{
        const b=el("button","opt",o.t.replace(/\n/g,"<br>"));
        b.addEventListener("click",()=>{
          if(answered)return;
          if(o.good){
            answered=true;
            card.querySelectorAll(".opt").forEach(x=>x.disabled=true);
            b.classList.add("correct");
            addXP(10,b);
            card.appendChild(el("div","why","<b>✓ Nice choice.</b> "+o.why));
            if(i===0){subject=o.t;mpSub.innerHTML='<span class="mailline">Subject: '+o.t+"</span>";}
            else{lines.push(o.t);mpBody.innerHTML=lines.map(x=>'<span class="mailline">'+x.replace(/\n/g,"<br>")+"</span>").join("\n\n");}
            const nxt=el("button","btn coral small",i<sc.steps.length-1?"Next step →":"Finish ✨");
            nxt.addEventListener("click",()=>{i++;if(i<sc.steps.length)renderStep();else finish();});
            card.appendChild(nxt);
          }else{
            mistakes++;
            b.classList.add("wrong");b.disabled=true;
            card.appendChild(el("div","why","<b>Hmm, not this one.</b> "+o.why+" <i>Pick another option.</i>"));
          }
        });
        card.appendChild(b);
      });
      stepWrap.appendChild(card);
      card.scrollIntoView({block:"nearest"});
    }
    function finish(){
      stepWrap.innerHTML="";
      const flawless=mistakes===0;
      if(flawless){addXP(20);confetti(80);}else confetti(40);
      const sccard=el("div","card scorecard",'<div class="bigscore">📮</div><div class="msg">'+(flawless?"Flawless — sent with style! (+20 bonus XP)":"Email built! "+mistakes+" wrong turn"+(mistakes===1?"":"s")+" along the way.")+'</div><div class="submsg">Here is the email your choices created — copy it as a starting point for the real thing.</div>');
      const cp=el("button","copychip","⧉ Copy this email");
      cp.addEventListener("click",()=>copyText("Subject: "+subject+"\n\n"+lines.join("\n\n"),cp));
      sccard.appendChild(cp);
      stepWrap.appendChild(sccard);
      store.done["s_"+sc.id]=true;save();
      mail.scrollIntoView({block:"start"});
    }
    renderStep();
  });
}

      if(SRClass){
        const res=el("div");
        const mic=el("button","roundbtn mic","🎙️");
        mic.addEventListener("click",()=>{
          if(mic.classList.contains("listening"))return;
          const r=new SRClass();
          r.lang="en-GB";r.interimResults=false;r.maxAlternatives=3;
          mic.classList.add("listening");
          res.innerHTML='<div class="sayresult">Listening… say “'+p.w.split(" / ")[0]+'”</div>';
          const targets=p.w.toLowerCase().split(" / ");
          r.onresult=e=>{
            let heard="";
            for(let a=0;a<e.results[0].length;a++)heard+=" "+e.results[0][a].transcript.toLowerCase();
            const ok=targets.some(t=>heard.includes(t));
            if(ok){res.innerHTML='<div class="sayresult good">✓ Heard you loud and clear — lovely! </div>';addXP(5,mic);}
            else res.innerHTML='<div class="sayresult tryagain">I heard “'+heard.trim().split(" ").slice(0,4).join(" ")+'” — listen once more and have another go!</div>';
          };
          r.onerror=()=>{res.innerHTML='<div class="sayresult tryagain">Mic didn’t catch that — try again.</div>';mic.classList.remove("listening");};
          r.onend=()=>mic.classList.remove("listening");
          try{r.start();}catch(e){mic.classList.remove("listening");}
        });
        row.appendChild(mic);
        mid.appendChild(res);
      }
      c.appendChild(row);
    });
    body.appendChild(c);
  });
}

function openPairs(){
  openDetail("👂 Minimal pairs game",body=>{
    body.appendChild(el("div","note","You'll hear one word. Tap the word you heard. These tiny sound differences (ship / sheep!) are what make spoken English click."));
    const wrap=el("div");body.appendChild(wrap);
    let round=0,score=0;const total=10;
    const deck=shuffle(PAIRS).slice(0,total);
    function play(target){speak(target,0.9);}
    function next(){
      if(round>=total)return finish();
      wrap.innerHTML="";
      const pair=deck[round];
      const target=Math.random()<0.5?pair.a:pair.b;
      const card=el("div","card");
      card.appendChild(el("div","qhead",'<div class="prog"><div class="progfill amber" style="width:'+(round/total*100)+'%"></div></div><span class="qcount">'+(round+1)+" / "+total+"</span>"));
      const bw=el("div","bigword","👂");
      card.appendChild(bw);
      const replay=el("button","btn ghost small","🔊 Hear it again");
      replay.addEventListener("click",()=>play(target));
      card.appendChild(replay);
      const btns=el("div","pairbtns");btns.style.marginTop="14px";
      let answered=false;
      [pair.a,pair.b].forEach(wd=>{
        const b=el("button","opt",wd);
        b.addEventListener("click",()=>{
          if(answered)return;answered=true;
          const ok=wd===target;
          if(ok){b.classList.add("correct");score++;addXP(5,b);}
          else{b.classList.add("wrong");btns.querySelectorAll(".opt").forEach(x=>{if(x.textContent===target)x.classList.add("reveal");});}
          bw.textContent="“"+target+"”";
          setTimeout(()=>{round++;next();},1100);
        });
        btns.appendChild(b);
      });
      card.appendChild(btns);
      wrap.appendChild(card);
      setTimeout(()=>play(target),350);
    }
    function finish(){
      wrap.innerHTML="";
      store.best.pairs=Math.max(store.best.pairs||0,score);save();
      if(score>=8)confetti(70);
      const sc=el("div","card scorecard",'<div class="bigscore">'+score+"/"+total+'</div><div class="msg">'+(score>=9?"Golden ears! 👑":score>=7?"Sharp listening! 👂":"Tricky, aren’t they? Try again!")+'</div><div class="submsg">Best so far: '+store.best.pairs+"/10</div>");
      const again=el("button","btn amber small","↻ Play again");
      again.addEventListener("click",openPairs);
      sc.appendChild(again);
      wrap.appendChild(sc);
    }
    next();
  });
}

function openShadowMenu(){
  openDetail("🗣️ Shadowing studio",body=>{
    body.appendChild(el("div","note","Shadowing = listen to a line, then say it back immediately, copying the speed, stress and melody. It's the fastest way to sound natural when presenting. Pick an excerpt:"));
    SHADOW.forEach(sh=>{
      body.appendChild(tileBtn(sh.icon,"amber",sh.title,sh.lines.length+" lines · about 2 minutes",false,()=>openShadow(sh)));
    });
  });
}
function openShadow(sh){
  openDetail(sh.icon+" "+sh.title,body=>{
    let rate=store.rate;
    body.appendChild(el("div","note","▶ a line, listen, then say it back out loud before playing the next. Repeat the whole excerpt until it feels easy in the mouth."));
    const sp=el("div","card");
    sp.appendChild(el("b",null,"Speed"));
    const row=el("div","speedrow");
    [["🐢 Slow",0.75],["🚶 Natural",1.0],["🏃 Brisk",1.15]].forEach((o,ix)=>{
      const b=el("button","speedchip"+(ix===1?" on":""),o[0]);
      b.addEventListener("click",()=>{row.querySelectorAll(".speedchip").forEach(x=>x.classList.remove("on"));b.classList.add("on");rate=o[1];});
      row.appendChild(b);
    });
    sp.appendChild(row);
    const all=el("button","btn amber small","▶ Play the whole excerpt");
    all.addEventListener("click",()=>{
      speechSynthesis.cancel();
      sh.lines.forEach(l=>queueSpeak(l,rate));
    });
    sp.appendChild(all);
    body.appendChild(sp);
    const c=el("div","card");
    sh.lines.forEach((l,ix)=>{
      const line=el("div","shadowline");
      line.appendChild(el("span","qcount",String(ix+1)));
      line.appendChild(el("span","ptxt",l));
      const pb=el("button","roundbtn play","🔊");
      pb.addEventListener("click",()=>speak(l,rate));
      line.appendChild(pb);
      c.appendChild(line);
    });
    body.appendChild(c);
  });
}
